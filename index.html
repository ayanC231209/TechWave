<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>TechWave</title>
</head>
<body>
    
    <header>

     <nav class="bg-[#190d32] py-5 px-5 lg:px-15 flex justify-between items-center">
            <div class="text-white text-5xl">
               Tech<span class="bg-gradient-to-br from-[#B302E1] to-[#F88871] bg-clip-text text-transparent font-extrabold ">Wave</span>
            </div>
            <div class="text-white  gap-5 font-semibold text-[16px] md:flex hidden">
                <div>About</div>
                <div>Episodes</div>
                <div>Host</div>
            </div>
            <div>
                <button class=" bg-[linear-gradient(48deg,#F7E93F_16.53%,#FB09B4_49.82%,#9100F8_81.65%)] gap-3 py-3 px-5 rounded-full btn border-none text-white  text-[16px]  md:flex hidden">
                    <div>
                        Subscribe
                    </div>
                    <div>
                       <i class="fa-solid fa-arrow-right" style="color: #FFF;"></i>
                    </div>
                </button>
            </div>
            <div class="md:hidden">
                <img src="/assets/hamburger-menu.png" alt="">
            </div>
     </nav>





    </header>

    <main>
       

        <div class="relative text-white bg-[#190d32] pb-40 overflow-hidden">
          <img src="assets/hero-bg.png" alt="" class="inset-0 absolute z-0 w-full object-cover">
          <div class="relative top-5 lg:top-17  flex justify-center z-10 ">
            <img class="w-[25%] lg:w-[20%]" src="assets/hero-circle.png" alt="">
          </div>

          <div class="relative flex justify-center z-20 -top-16 md:-top-50 lg:-top-30 xl:-top-45">
            <img class="w-[10%] md:w-[20%px] lg:w-[7%] " src="assets/microphone.png" alt="">
          </div>
          <div class="relative">
            <div class="relative flex justify-center font-extrabold text-[50px]   md:top-5 lg:-top-15 xl:-top-20 ">
            TechWave
            </div>
            <div class="px-5 relative flex justify-center md: lg:-top-15 xl:-top-20 items-center text-center font-extralight opacity-70">
                Your daily dose of tech insights, productivity hacks, and personal growth
                
        
          </div>

          <div class="relative flex justify-center  gap-3 top-4 lg:-top-10 xl:-top-15">
            <div>
                <button class="bg-[linear-gradient(48deg,#F7E93F_16.53%,#FB09B4_49.82%,#9100F8_81.65%)] gap-3 py-3 px-5 rounded-full btn border-none text-white  text-[16px] flex">
                    <div>
                      <img src="assets/spotify.png" alt="">
                    </div>
                    <div>
                        Listen on Spotify
                    </div>
                </button>
            </div>

            <div>
                <button class="border border-green-400 bg-transparent gap-3 py-2.5 px-5 rounded-full   text-white  text-[16px] flex items-center">
                    <div>
                      <img src="assets/message.png" alt="">
                    </div>
                    <div class="text-green-400">
                        Subscribe
                    </div>
                </button>
            </div>

          </div>
          
        </div>


    </main>
</body>
</html>
